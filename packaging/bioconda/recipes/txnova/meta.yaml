{% set name = "txnova" %}
{% set version = "0.1.5" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: "PLEASE_UPDATE_AFTER_PYPI_UPLOAD"

build:
  number: 0
  skip: true  # [win]
  script:
    - export LIBCLANG_PATH="${PREFIX}/lib"
    - "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv"
  run_exports:
    - {{ pin_subpackage('txnova', max_pin="x") }}

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
  host:
    - python >=3.10
    - pip
    - maturin >=1.7,<2
    - clangdev
    - libclang
    - llvmdev
    - zlib
    - bzip2
    - xz
  run:
    - python >=3.10
    - typer >=0.12
    - pydantic >=2.5,<3
    - pyyaml >=6.0
    - pandas >=2.0,<3
    - rich >=13.0
    - jinja2 >=3.1
    - pydeseq2 >=0.4
    - numpy >=1.23,<3
    - scipy >=1.9

test:
  imports:
    - txnova
    - txnova._core
  commands:
    - txnova --version
    - txnova --help

about:
  home: https://github.com/leelieber2025/TxNova
  dev_url: https://github.com/leelieber2025/TxNova
  doc_url: https://txnova.readthedocs.io
  summary: Experimental-group-specific novel intergenic transcripts from bulk RNA-seq BAMs
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - leelieber2025
  notes: |
    No external assembler binary is required at runtime (StringTie is not a
    dependency). Input is a coordinate-sorted, indexed BAM from STAR or
    HISAT2 -- TxNova does not align. Windows is not built (skip: true [win]);
    Windows users should run TxNova under WSL2.
